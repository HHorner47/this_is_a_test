<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .box{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh
        }
        .btn{
            padding: 64px;
            font-size: larger;
        }
    </style>
    <title>Document</title>
</head>
<body><div class="box">
        <button id="btn" class="btn">押せ</button>
</div>


<script>
    const btn = document.getElementById("btn");
    btn.addEventListener("click",function(){
        alert("これを押したあなたはゲイです");
        alert("okって押したね");
        alert("やっぱりゲイやん");
    })
</script>
</body>
</html>
